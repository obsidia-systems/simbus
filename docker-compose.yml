# simbus — Industrial Field Device Simulator
#
# One container = one process = one device YAML.
# Every service has a profile. Bare `docker compose up` starts nothing.
#
#   docker compose --profile all up          # 7 builtin + 4 Papouch (11)
#   docker compose up tnh-sensor crac        # named services (no profile needed)
#   docker compose --profile power up        # UPS + PDU + power-meter
#   docker compose --profile env up          # T&H + leak + door
#   docker compose --profile cooling up      # CRAC
#   docker compose --profile custom up       # Papouch TH2E × 4
#
# Port map (host -> container):
#   tnh-sensor       5020 -> 502    API 8000 -> 8000
#   ups              5021 -> 502    API 8001 -> 8000
#   pdu              5022 -> 502    API 8002 -> 8000
#   crac             5023 -> 502    API 8003 -> 8000
#   power-meter      5024 -> 502    API 8004 -> 8000
#   leak-sensor      5025 -> 502    API 8005 -> 8000
#   door-contact     5026 -> 502    API 8006 -> 8000
#   papouch-th2e-01  5512 -> 512    API 8100 -> 8000
#   papouch-th2e-02  5513 -> 512    API 8101 -> 8000
#   papouch-th2e-03  5514 -> 512    API 8102 -> 8000
#   papouch-th2e-04  5515 -> 512    API 8103 -> 8000

x-simbus-defaults: &simbus-defaults
  build:
    context: .
    dockerfile: Dockerfile
    target: runtime
  restart: unless-stopped
  cap_add:
    - NET_BIND_SERVICE
  networks:
    - simbus

services:

  # ── Environmental sensors ──────────────────────────────────────────────────

  tnh-sensor:
    <<: *simbus-defaults
    container_name: simbus-tnh-sensor
    environment:
      SIMBUS_YAML_PATH: /app/devices/builtin/generic-tnh-sensor.yaml
      SIMBUS_TICK_INTERVAL: "1.0"
    ports:
      - "5020:502"    # Modbus TCP
      - "8000:8000"   # REST API
    profiles: ["env", "all"]

  leak-sensor:
    <<: *simbus-defaults
    container_name: simbus-leak-sensor
    environment:
      SIMBUS_YAML_PATH: /app/devices/builtin/generic-leak-sensor.yaml
      SIMBUS_TICK_INTERVAL: "1.0"
    ports:
      - "5025:502"
      - "8005:8000"
    profiles: ["env", "all"]

  door-contact:
    <<: *simbus-defaults
    container_name: simbus-door-contact
    environment:
      SIMBUS_YAML_PATH: /app/devices/builtin/generic-door-contact.yaml
      SIMBUS_TICK_INTERVAL: "1.0"
    ports:
      - "5026:502"
      - "8006:8000"
    profiles: ["env", "all"]

  # ── Cooling ────────────────────────────────────────────────────────────────

  crac:
    <<: *simbus-defaults
    container_name: simbus-crac
    environment:
      SIMBUS_YAML_PATH: /app/devices/builtin/generic-crac.yaml
      SIMBUS_TICK_INTERVAL: "1.0"
    ports:
      - "5023:502"
      - "8003:8000"
    profiles: ["cooling", "all"]

  # ── Power ──────────────────────────────────────────────────────────────────

  ups:
    <<: *simbus-defaults
    container_name: simbus-ups
    environment:
      SIMBUS_YAML_PATH: /app/devices/builtin/generic-ups.yaml
      SIMBUS_TICK_INTERVAL: "1.0"
    ports:
      - "5021:502"
      - "8001:8000"
    profiles: ["power", "all"]

  pdu:
    <<: *simbus-defaults
    container_name: simbus-pdu
    environment:
      SIMBUS_YAML_PATH: /app/devices/builtin/generic-pdu.yaml
      SIMBUS_TICK_INTERVAL: "1.0"
    ports:
      - "5022:502"
      - "8002:8000"
    profiles: ["power", "all"]

  power-meter:
    <<: *simbus-defaults
    container_name: simbus-power-meter
    environment:
      SIMBUS_YAML_PATH: /app/devices/builtin/generic-power-meter.yaml
      SIMBUS_TICK_INTERVAL: "1.0"
    ports:
      - "5024:502"
      - "8004:8000"
    profiles: ["power", "all"]

  # ── Community example: Papouch TH2E (profile custom or all) ───────────────
  papouch-th2e-01:
    <<: *simbus-defaults
    container_name: simbus-papouch-th2e-01
    volumes:
    - ./devices:/app/devices:ro   # mount at runtime, no rebuild needed
    environment:
      SIMBUS_YAML_PATH: /app/devices/community/papouch-th2e.yaml
    ports:
      - "5512:512"
      - "8100:8000"
    profiles: ["custom", "all"]

  papouch-th2e-02:
    <<: *simbus-defaults
    container_name: simbus-papouch-th2e-02
    volumes:
    - ./devices:/app/devices:ro   # mount at runtime, no rebuild needed
    environment:
      SIMBUS_YAML_PATH: /app/devices/community/papouch-th2e.yaml
    ports:
      - "5513:512"
      - "8101:8000"
    profiles: ["custom", "all"]

  papouch-th2e-03:
    <<: *simbus-defaults
    container_name: simbus-papouch-th2e-03
    volumes:
    - ./devices:/app/devices:ro   # mount at runtime, no rebuild needed
    environment:
      SIMBUS_YAML_PATH: /app/devices/community/papouch-th2e.yaml
    ports:
      - "5514:512"
      - "8102:8000"
    profiles: ["custom", "all"]

  papouch-th2e-04:
    <<: *simbus-defaults
    container_name: simbus-papouch-th2e-04
    volumes:
    - ./devices:/app/devices:ro   # mount at runtime, no rebuild needed
    environment:
      SIMBUS_YAML_PATH: /app/devices/community/papouch-th2e.yaml
    ports:
      - "5515:512"
      - "8103:8000"
    profiles: ["custom", "all"]

networks:
  simbus:
    driver: bridge
