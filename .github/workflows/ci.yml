name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Validate device YAML
        run: |
          set -euo pipefail
          cargo build -p runtime --locked --quiet
          fail=0
          while IFS= read -r -d '' f; do
            echo "==> $f"
            if ! ./target/debug/simbus check "$f"; then
              fail=1
            fi
          done < <(find devices -name '*.yaml' -print0 | sort -z)
          exit "$fail"

  python-legacy:
    name: Python (legacy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run ruff check
        run: uv run ruff check simbus tests

      - name: Run ruff format check
        run: uv run ruff format --check simbus tests

      - name: Run mypy
        run: uv run mypy simbus

      - name: Run tests with coverage
        run: uv run pytest -v --cov=simbus --cov-report=term-missing --cov-fail-under=95
