name: "Generic T&H Sensor"
spec_version: 1
version: "1.0"
type: tnh_sensor
description: >
  Generic temperature and humidity sensor.
  Models a two-register Modbus device typical of
  environmental monitoring in hot/cold aisles.

modbus:
  default_port: 502
  unit_id: 1
  endianness: big

registers:
  holding:
    - address: 0
      name: temperature
      description: "Ambient temperature"
      unit: "°C"
      default: 22.5
      scale: 10           # raw = real_value × 10  (e.g. 22.5 °C → 225)
      data_type: uint16
      simulation:
        behavior: gaussian_noise
        std_dev: 0.3
        drift:
          enabled: true
          rate: 0.01       # °C per tick
          bounds: [18.0, 35.0]

    - address: 1
      name: humidity
      description: "Relative humidity"
      unit: "%RH"
      default: 45.0
      scale: 10
      data_type: uint16
      simulation:
        behavior: sinusoidal
        period_hours: 12
        amplitude: 5.0

  coils:
    - address: 0
      name: high_temp_alarm
      description: "High temperature alarm active"
      default: false
      trigger:
        source_register: temperature
        condition: gt
        threshold: 30.0

    - address: 1
      name: low_humidity_alarm
      description: "Low humidity alarm active"
      default: false
      trigger:
        source_register: humidity
        condition: lt
        threshold: 30.0

alarms:
  - name: "High Temperature"
    severity: warning
    trigger: high_temp_alarm
  - name: "Low Humidity"
    severity: warning
    trigger: low_humidity_alarm

scenarios:
  - id: heat-wave
    name: Heat Wave Event
    description: >
      Simulates a gradual temperature rise in a server room,
      triggering the high-temp alarm after 10 seconds.
      Useful for testing SCADA alarm pipelines and notification chains.
    steps:
      - at: 0
        action: set_register
        register_name: temperature
        value: 22.0
      - at: 2
        action: set_register
        register_name: temperature
        value: 25.0
      - at: 5
        action: set_register
        register_name: temperature
        value: 30.0
      - at: 10
        action: set_register
        register_name: temperature
        value: 35.0
      - at: 12
        action: inject_fault
        fault_type: spike
        register_name: temperature
        value: 42.0
        duration_s: 30
      - at: 15
        action: set_tick_interval
        tick_interval: 0.5
      - at: 45
        action: set_tick_interval
        tick_interval: 1.0

  - id: thermal-runaway
    name: Thermal Runaway
    description: >
      Temperature climbs through alarm threshold, spike hits, then recovery.
      Tests SCADA alarm detection, escalation, and auto-clear logic.
    steps:
      - at: 0
        action: set_register
        register_name: temperature
        value: 22.0
      - at: 10
        action: set_register
        register_name: temperature
        value: 28.0
      - at: 20
        action: set_register
        register_name: temperature
        value: 32.0
      - at: 30
        action: inject_fault
        fault_type: spike
        register_name: temperature
        value: 45.0
        duration_s: 60
      - at: 40
        action: set_register
        register_name: temperature
        value: 35.0
      - at: 120
        action: set_register
        register_name: temperature
        value: 22.0

  - id: fast-alarm-test
    name: Fast Alarm Test
    description: >
      Accelerated thermal event for CI pipelines.
      Completes in ~3 seconds with 10x time acceleration.
    steps:
      - at: 0
        action: set_tick_interval
        tick_interval: 0.1
      - at: 0.5
        action: set_register
        register_name: temperature
        value: 35.0
      - at: 2.0
        action: set_register
        register_name: temperature
        value: 22.0
      - at: 2.5
        action: set_tick_interval
        tick_interval: 1.0

  - id: stuck-sensor
    name: Stuck Sensor
    description: >
      Temperature sensor freezes while humidity rises.
      Tests SCADA stale-data detection.
    steps:
      - at: 0
        action: set_register
        register_name: temperature
        value: 22.0
      - at: 5
        action: inject_fault
        fault_type: freeze
        register_name: temperature
        duration_s: 60
      - at: 10
        action: set_register
        register_name: humidity
        value: 80.0
