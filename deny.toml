[graph]
all-features = false
no-default-features = false

[advisories]
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "async-opcua 0.19 depends on rsa; no upgrade exists. This version serves OPC UA None+Anonymous only (no SignAndEncrypt)." },
    { id = "RUSTSEC-2023-0089", reason = "async-opcua 0.19 postcard/heapless still uses unmaintained atomic-polyfill; no upgrade exists." },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
